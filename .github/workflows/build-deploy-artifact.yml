name: Build deployable site

# Produces the exact folder that gets uploaded to Hostinger.
#
# Why this exists: deployment is done from a browser, which cannot run a build.
# This workflow runs the build on GitHub and force-pushes the finished `out/`
# to a branch called `deploy`, whose contents can then be downloaded as a
# single ZIP from a stable URL:
#
#   https://github.com/<owner>/<repo>/archive/refs/heads/deploy.zip
#
# That ZIP is uploaded to Hostinger's File Manager and extracted in place.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rechargachargine.com

      - name: Verify the build is complete
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -f out/index.html ] || fail "index.html missing"
          [ -f out/.htaccess ] || fail ".htaccess missing — every page would 404 on Apache"
          [ -f out/api/contact.php ] || fail "contact.php missing — the form could not send"
          [ -f out/404.html ] || fail "404.html missing"
          [ -f out/sitemap.xml ] || fail "sitemap.xml missing"
          [ -f out/robots.txt ] || fail "robots.txt missing"
          [ -f out/team/sehej-sharma.html ] || fail "founder page missing"
          [ -f out/team/ali-electricwala.html ] || fail "founder page missing"
          # The site must never ship with a placeholder origin.
          if grep -rqs "recharga.vercel.app" out/sitemap.xml; then
            fail "sitemap still points at the old origin"
          fi
          echo "Build verified. $(find out -type f | wc -l) files, $(du -sh out | cut -f1)."

      - name: Publish to the deploy branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Orphan branch containing only the built site, at the root.
          rm -rf .deploy && mkdir .deploy
          cp -a out/. .deploy/
          cd .deploy
          # Nothing here should be interpreted as a repo of its own.
          rm -f .gitignore
          git init -q
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
          echo "Pushed to the deploy branch."

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: rechargachargine-site
          path: out/
          retention-days: 30
          if-no-files-found: error
